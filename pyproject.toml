[project]
name = "flowquake"
version = "0.1.0"
description = "Selective-SSM + flow-matching marked point process for the EarthquakeNPP benchmark"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy",
    "pandas",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["flowquake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
