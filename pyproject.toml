[project]
name = "flowquake"
version = "0.1.0"
description = "Selective-SSM + flow-matching marked point process for the EarthquakeNPP benchmark"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy",
    "pandas",
    "scipy",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
figures = ["matplotlib", "scipy"]
# CSEP consistency tests (flowquake.csep_forecast) + the ETAS head-to-head
# (flowquake.etas_csep). NOTE: etas is not on PyPI — install from GitHub.
csep = ["pycsep", "scipy"]
etas = ["etas @ git+https://github.com/lmizrahi/etas.git", "seismostats==1.0.1"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["flowquake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
