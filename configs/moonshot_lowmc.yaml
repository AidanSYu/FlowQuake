# MOONSHOT.md panel: ComCat California — the HIGH-mc ANCHOR of the multi-region
# design, no longer the main event. See "The data plan" in MOONSHOT.md.
#
# This catalog was originally meant to carry the whole curve on a
# {3.0, 2.5, 2.0, 1.5} grid. It cannot: with the safety margin applied, ZERO
# 1-degree cells are complete at mc 1.5, and the usable grid is {3.5, 3.0, 2.8}
# — about 0.7 decades. Its value to the design is the opposite of the dense
# panels': 300 M>=4 test targets across 67 of 77 windows, which no 90-km box
# can supply. It anchors the high-mc end of the pooled fit while WHITE and QTM
# anchor the low.
#
# Its targets are still concentrated — 34% in the single Ridgecrest window — so
# its interval MUST come from the paired block bootstrap in flowquake.pooling,
# never from an event-level one.
#
# `mcut` here is only a default: scripts/scaling_curve.py OVERRIDES it per curve
# point. What matters in this file is everything that must stay FIXED across the
# curve — splits, architecture, optimiser — so that mc is the only thing varying.
#
# COMPLETENESS — read MOONSHOT.md invariant 1e before changing `mc` anywhere.
#
# The Mc = 1.30 that scripts/build_comcat_lowmc.py reports is a MAXIMUM-CURVATURE
# estimate and it is optimistic. By b-value stability, statewide California only
# becomes complete around mc 2.6:
#
#     mc     1.0    1.5    2.0    2.5    2.6    3.0
#     b     0.740  0.837  0.914  0.968  0.977  0.978
#
# b must be flat above true completeness; that drift is missing small events.
#
# The statewide figure is a MIXTURE artifact, not the whole story — per 1 degree
# cell the same estimator gives Mc 1.2-1.8 across the well-instrumented interior,
# and the aggregate is dragged down by the offshore/border cells. So low-mc
# points are legitimate, but ONLY inside a completeness mask:
#
#     flowquake.completeness.build_mask(df, train_end=val_start,
#                                       mc_threshold=<lowest mc on the grid>)
#
# Measured with train_end=2011-01-01 and mc_threshold=1.5: 7 cells, 229,207
# events, mc_union=1.3, and 126 M>=4 test-window targets (statewide: 293).
# The mask must be built from the training era ONLY and held fixed across every
# point and control. Scoring the {3.0, 2.5, 2.0, 1.5} grid statewide is invalid.
#
# train_start is later than the benchmark's 1981 for the same reason: a low-mc
# point trained on the 1980s would be measuring missing data, not information.
# The TARGET set is unaffected either way (invariant 1).
data:
  catalog_path: reference/Datasets/ComCat_lowmc/ComCat_lowmc_catalog.csv
  mcut: 2.5
  aux_start: '1999-01-01'
  train_start: '2000-01-01'
  val_start: '2011-01-01'
  test_start: '2014-01-01'
  test_end: '2020-01-17'
model:
  d_model: 96
  n_layers: 4
  d_state: 32
  n_heads: 6
  expand: 2
  chunk: 64
  flow_hidden: 96
  mix_hidden: 64
  flow_layers: 3
  loss_weights: [1.0, 1.0, 0.5]
  sigma_min: [0.02, 0.01, 0.05]
  dropout: 0.1
  mag_dequant: 0.01
  input_noise: 0.1
  h_bottleneck: 0
  h_noise: 0.3
  spatial_density_feat: true
  d_floor_km: 0.1
  encoder_input: full
train:
  window: 2048
  burn_in: 256
  batch_size: 8
  steps: 20000
  lr: 0.0003
  weight_decay: 0.03
  warmup: 500
  grad_clip: 1.0
  seed: 1555
  val_every: 250
  val_events: 4096
  val_ode_steps: 32
  patience: 16
  out_dir: runs/moonshot_lowmc
