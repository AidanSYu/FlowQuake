data:
  catalog_path: runs/real_validation_h1/catalogs/informative.csv
  mcut: 1.0
  aux_start: '2008-01-01'
  train_start: '2008-01-01'
  val_start: '2015-01-01'
  test_start: '2016-06-01'
  test_end: '2020-12-31'
model:
  d_model: 64
  n_layers: 3
  d_state: 24
  n_heads: 4
  expand: 2
  chunk: 64
  flow_hidden: 64
  mix_hidden: 48
  flow_layers: 3
  loss_weights:
  - 1.0
  - 1.0
  - 0.5
  sigma_min:
  - 0.02
  - 0.01
  - 0.05
  dropout: 0.15
  mag_dequant: 0.01
  input_noise: 0.1
  h_bottleneck: 0
  h_noise: 0.3
  spatial_density_feat: true
  d_floor_km: 0.1
  encoder_input: full
train:
  window: 1024
  burn_in: 128
  batch_size: 8
  steps: 12000
  lr: 0.0004
  weight_decay: 0.05
  warmup: 400
  grad_clip: 1.0
  seed: 1555
  val_every: 200
  val_events: 2048
  val_ode_steps: 32
  patience: 20
  out_dir: runs/real_validation_h1/informative
